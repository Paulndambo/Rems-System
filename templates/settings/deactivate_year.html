
<div class="modal fade" id="deactivateYearModal{{year.id}}" tabindex="-1" aria-labelledby="deactivateModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalLabel">Deactivate Year</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="tenantForm" method="POST" action="{% url 'deactivate-year' %}">
                <div class="modal-body">
                    {% csrf_token %}
                    <input type="number" name="year_id" id="year_id" value="{{year.id}}" readonly hidden>
                    <div class="row mb-2">
                        <p>Are you sure you want to mark <b>{{year.name}}</b> as deactivated?</p>
                   </div>
                    
                <div class="text-center mb-2">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Yes, Deactivate</button>
                </div>
            </form>
        </div>
    </div>
</div>
