<!-- Add this modal HTML after the table in your template -->
<div class="modal fade" id="newWaterBillModal" tabindex="-1" aria-labelledby="tenantModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalLabel">Add Water Bill</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="tenantForm" method="POST" action="{% url 'new-water-bill' %}">
                <div class="modal-body">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Unit</label>
                        <select class="form-select" id="unit" name="unit">
                            <option value="" selected>Choose...</option>
                            {% for unit in units %}
                                <option value="{{unit.id}}">{{unit.name}}({{unit.property}})</option>
                            {% endfor %}
                        </select>
                    </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Month</label>
                        <select class="form-select" id="month" name="month">
                            <option value="" selected>Choose...</option>
                            {% for month in months %}
                                <option value="{{month}}">{{month}}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="rent" class="form-label fw-bold">Year</label>
                        <select class="form-select" id="year" name="year">
                            <option value="" selected>Choose...</option>
                            {% for year in years %}
                                <option value="{{year.id}}">{{year.name}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <label for="unit" class="form-label fw-bold">Unpaid Balanaces</label>
                        <input type="number" class="form-control" id="previous_balance" name="previous_balance" min="0.00" value="0.00" step="0.01" />
                    </div>
                    <div class="col">
                        <label for="unit" class="form-label fw-bold">Previous Reading</label>
                        <input type="number" class="form-control" min="0.00" step="0.01" value="0.00" id="previous_reading" name="previous_reading" required/>
                    </div>
                    <div class="col">
                        <label for="unit" class="form-label fw-bold">Current Reading</label>
                        <input type="number" class="form-control" id="current_reading" name="current_reading" step="0.01" value="0.00" required/>
                    </div>
                </div>
                    
                </div>
                <div class="text-center mb-3">
                    <button type="submit" class="btn btn-primary">Save Water Bill</button>
                </div>
            </form>
        </div>
    </div>
</div>
