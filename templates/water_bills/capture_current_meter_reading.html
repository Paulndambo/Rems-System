<div class="modal fade" id="captureCurrentMeterReadingModal{{ bill.id }}" tabindex="-1" aria-labelledby="captureMeterReadingLabel{{ bill.id }}" aria-hidden="true">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="captureMeterReadingLabel{{ bill.id }}">
                    <i class="fa-solid fa-droplet text-primary"></i> Capture Meter Reading
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="captureMeterReadingForm{{ bill.id }}" method="POST" action="{% url 'capture-current-meter-readings' %}">
                <div class="modal-body">
                    {% csrf_token %}
                    <input type="hidden" name="bill_id" value="{{ bill.id }}">
                    
                    <div class="alert alert-info mb-3">
                        <strong>Unit:</strong> {{ bill.unit.property.name }} ({{ bill.unit.name }})<br>
                        <strong>Previous Reading:</strong> {{ bill.previous_reading }} Units<br>
                        <strong>Month:</strong> {{ bill.month.name }} {{ bill.year.name }}
                    </div>
                    
                    <div class="mb-3">
                        <label for="current_reading_{{ bill.id }}" class="form-label fw-bold">
                            Current Meter Reading <span class="text-danger">*</span>
                        </label>
                        <input type="number" 
                               class="form-control" 
                               id="current_reading_{{ bill.id }}" 
                               name="current_reading" 
                               min="{{ bill.previous_reading }}"
                               step="0.01"
                               placeholder="Enter current reading"
                               required>
                        <div class="form-text">Must be greater than or equal to previous reading</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fa-solid fa-times"></i> Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-save"></i> Save Reading
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
