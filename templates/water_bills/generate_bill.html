{% extends "base.html" %}
{% load static %}

{% block title %}Generate Unit Bill – REMS{% endblock %}
{% block page_title %}Generate Bill{% endblock %}

{% block content %}

<!-- Select2 CSS -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<div class="row justify-content-center">
    <div class="col-12 col-xl-8">
        <form method="POST" action="{% url 'generate-bill' %}">
            {% csrf_token %}

            <div class="rems-card mb-4">
                <div class="rems-card__header">
                    <h5>Generate Unit Bill</h5>
                </div>

                <div class="rems-card__body">

                    <!-- PROPERTY -->
                    <div class="mb-3">
                        <label class="form-label">Property *</label>
                        <select id="property" name="property" class="form-select" required>
                            <option value="">-- Select Property --</option>
                            {% for property in properties %}
                                <option value="{{ property.id }}">{{ property.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- HIDDEN SECTION -->
                    <div id="dependent-fields" style="display:none;">

                        <!-- UNIT -->
                        <div class="mb-3">
                            <label class="form-label">Unit *</label>
                            <select id="unit" name="unit" class="form-select" required></select>
                        </div>

                        <!-- MONTH -->
                        <div class="mb-3">
                            <label class="form-label">Month *</label>
                            <select name="month" class="form-select" required>
                                <option value="">-- Select Month --</option>
                                {% for m in months %}
                                    <option value="{{ m }}">{{ m }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- READING -->
                        <div class="mb-3">
                            <label class="form-label">Current Meter Reading *</label>
                            <input type="number" name="current_reading" class="form-control" required />
                        </div>

                    </div>

                </div>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Generate Bill</button>
            </div>
        </form>
    </div>
</div>

<!-- jQuery (required for Select2) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Select2 -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const propertySelect = document.getElementById("property");
    const dependentFields = document.getElementById("dependent-fields");

    propertySelect.addEventListener("change", function () {
        const propertyId = this.value;

        if (!propertyId) {
            dependentFields.style.display = "none";
            return;
        }

        dependentFields.style.display = "block";

        // Fetch units via AJAX
        fetch(`/payments/get-units/?property_id=${propertyId}`)
            .then(response => response.json())
            .then(data => {
                const unitSelect = $('#unit');

                unitSelect.empty();

                data.forEach(unit => {
                    unitSelect.append(
                        new Option(unit.name, unit.id)
                    );
                });

                // Reinitialize Select2
                unitSelect.select2({
                    placeholder: "Search unit...",
                    width: '100%'
                });
            });
    });
});
</script>

{% endblock %}
