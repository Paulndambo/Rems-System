<!-- Add this modal HTML after the table in your template -->
<div class="modal fade" id="editWaterBillModal{{bill.id}}" tabindex="-1" aria-labelledby="tenantModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalLabel">Edit Water Bill</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="tenantForm" method="POST" action="{% url 'edit-water-bill' %}">
                <div class="modal-body">
                    {% csrf_token %}
                    <input type="number" name="bill_id" id="bill_id" value="{{bill.id}}" readonly hidden>
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Unit</label>
                        <select class="form-select" id="unit" name="unit">
                            <option value="{{bill.unit.id}}" selected>{{bill.unit.name}}</option>
                            {% for unit in units %}
                                {% if unit.id != bill.unit.id %}
                                    <option value="{{unit.id}}">{{unit.name}}</option>
                                {% endif %}
                            {% endfor %}
                        </select>
                    </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Month</label>
                        <select class="form-select" id="month" name="month">
                            <option value="{{bill.month}}" selected>{{bill.month}}</option>
                            {% for month in months %}
                                {% if month != bill.month %}
                                    <option value="{{month}}">{{month}}</option>
                                {% endif %}
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="rent" class="form-label fw-bold">Year</label>
                        <select class="form-select" id="year" name="year">
                            <option value="{{bill.year}}" selected>{{bill.year}}</option>
                            {% for year in years %}
                                {% if year != bill.year %}
                                    <option value="{{year}}">{{year}}</option>
                                {% endif %}
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <label for="unit" class="form-label fw-bold">Previous Reading</label>
                        <input type="number" class="form-control" id="previous_reading" name="previous_reading" value="{{bill.previous_reading}}" required/>
                    </div>
                    <div class="col">
                        <label for="unit" class="form-label fw-bold">Units</label>
                        <input type="number" class="form-control" id="units" name="units" value="{{bill.units}}" required/>
                    </div>
                </div>
                </div>
                <div class="text-center mb-3">
                    <button type="submit" class="btn btn-primary">Save Water Bill</button>
                </div>
            </form>
        </div>
    </div>
</div>
