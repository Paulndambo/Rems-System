{% extends "base.html" %}
{% load static %}

{% block title %}Edit Property – REMS{% endblock %}
{% block page_title %}Edit Property{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
    <a href="{% url 'properties' %}" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
        <h1 class="fs-4 fw-bold mb-0">Edit Property</h1>
        <p class="text-muted mb-0" style="font-size:.82rem">Update property details</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-12 col-xl-10">
        <form method="POST" action="{% url 'edit-property' %}">
            {% csrf_token %}
            <!-- The view expects property_id in the post request. We can get it from URL parameter if it's there -->
            <input type="hidden" name="property_id" value="{{ request.GET.id }}">
            
            <div class="rems-card mb-4">
                <div class="rems-card__header">
                    <h5 class="rems-card__title"><i class="fa-solid fa-building me-2 text-primary"></i>Property Information</h5>
                </div>
                <div class="rems-card__body">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label fw-600">Property Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control" placeholder="Property name" value="{{property.name}}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Number of Units <span class="text-danger">*</span></label>
                            <input type="number" name="units" class="form-control" placeholder="Total units" value="{{property.units}}" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-600">Address line <span class="text-danger">*</span></label>
                            <input type="text" name="address" class="form-control" placeholder="Address" value="{{property.address}}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">City <span class="text-danger">*</span></label>
                            <input type="text" name="city" class="form-control" placeholder="City" value="{{property.city}}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Country <span class="text-danger">*</span></label>
                            <input type="text" name="country" class="form-control" placeholder="Country" value="{{property.country}}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Garbage Charge (KES) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="garbage_charge" class="form-control" value="{{property.garbage_charge}}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Water Charge (KES) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="water_charge" class="form-control" value="{{property.water_charge}}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">House Manager <span class="text-danger">*</span></label>
                            <select name="house_manager" class="form-control" required>
                                <option value="">Select House Manager</option>
                                {% for manager in house_managers %}
                                    <option value="{{ manager.id }}" {% if manager.id == property.house_manager.id %}selected{% endif %}>
                                        {{ manager.get_full_name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'properties' %}" class="rems-btn rems-btn--ghost">Cancel</a>
                <button type="submit" class="rems-btn rems-btn--primary">
                    <i class="fa-solid fa-floppy-disk me-2"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
