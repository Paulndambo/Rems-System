<!-- Add this modal HTML after the table in your template -->
<div class="modal fade" id="deletePropertyModal{{property.id}}" tabindex="-1" aria-labelledby="tenantModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalLabel">Delete Property</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="tenantForm" method="POST" action="{% url 'delete-property' %}">
                <div class="modal-body">
                    {% csrf_token %}
                    <input type="number" name="property_id" id="property_id" value="{{property.id}}" readonly hidden>
                    <div class="row mb-2">
                        <p>Are you sure you want to delete property named: <b>{{property.name}}</b>?</p>
                   </div>
                    
                <div class="text-center mb-2">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
