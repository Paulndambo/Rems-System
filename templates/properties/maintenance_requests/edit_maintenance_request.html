<!-- Add this modal HTML after the table in your template -->
<div class="modal fade" id="editRequestModal{{request.id}}" tabindex="-1" aria-labelledby="tenantModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalLabel">Edit Maintenance Request</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="tenantForm" method="POST" action="{% url 'edit-maintenance-request' %}">
                <div class="modal-body">
                    {% csrf_token %}
                    <input type="hidden" name="request_id" id="request_id" value="{{request.id}}">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Request Title</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{request.title}}" required>
                    </div>
                    
                <div class="mb-3">
                    <label for="move_in_date" class="form-label fw-bold">Unit</label>
                    <select class="form-select" id="unit" name="unit" required>
                        <option value="{{request.unit.id}}" selected>{{request.unit.name}}</option>
                        {% for unit in units %}
                            {% if unit.id != request.unit.id %}
                                <option value="{{unit.id}}">{{unit.name}}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>
                    
                    <div class="mb-2">
                        <label for="description" class="form-label fw-bold">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="2" required>{{request.description}}</textarea>
                    </div>

                <div class="mb-3">
                    <label for="move_in_date" class="form-label fw-bold">Status</label>
                    <select class="form-select" id="status" name="status" required>
                        <option value="{{request.status}}" selected>{{request.status}}</option>
                        {% if request.status == "Pending" %}
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                            <option value="Overdue">Overdue</option>
                        {% elif request.status == "In Progress" %}
                            <option value="Completed">Completed</option>
                            <option value="Overdue">Overdue</option>
                        {% elif request.status == "Completed" %}
                            <option value="Overdue">Overdue</option>
                        {% elif request.status == "Overdue" %}
                            <option value="Pending">Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        {% endif %}
                    </select>
                </div>
                </div>
                <div class="text-center mb-3">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Request</button>
                </div>
            </form>
        </div>
    </div>
</div>
