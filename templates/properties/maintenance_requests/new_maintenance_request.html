{% extends "base.html" %}
{% load static %}

{% block title %}New Maintenance Request – REMS{% endblock %}
{% block page_title %}New Maintenance Request{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
    <a href="{% url 'maintenance-requests' %}" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
        <h1 class="fs-4 fw-bold mb-0">Create Maintenance Request</h1>
        <p class="text-muted mb-0" style="font-size:.82rem">Log a new issue for a unit</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-12 col-xl-8">
        <form method="POST" action="{% url 'new-maintenance-request' %}">
            {% csrf_token %}
            <div class="rems-card mb-4">
                <div class="rems-card__header">
                    <h5 class="rems-card__title">Request Details</h5>
                </div>
                <div class="rems-card__body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-600">Unit ID <span class="text-danger">*</span></label>
                            <input type="number" name="unit" class="form-control" placeholder="e.g. 7" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Priority <span class="text-danger">*</span></label>
                            <select name="priority" class="form-select" required>
                                <option value="High">High</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-600">Title <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control" placeholder="e.g. Leaking sink in kitchen" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-600">Description <span class="text-danger">*</span></label>
                            <textarea name="description" rows="4" class="form-control" placeholder="Describe the maintenance issue..." required></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'maintenance-requests' %}" class="rems-btn rems-btn--ghost">Cancel</a>
                <button type="submit" class="rems-btn rems-btn--primary">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Create Request
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
