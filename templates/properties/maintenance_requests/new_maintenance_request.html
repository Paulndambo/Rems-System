<!-- Add this modal HTML after the table in your template -->
<div class="modal fade" id="newRequestModal" tabindex="-1" aria-labelledby="tenantModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalLabel">Add New Maintenance Request</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="tenantForm" method="POST" action="{% url 'new-maintenance-request' %}">
                <div class="modal-body">
                    {% csrf_token %}
                
                    <div class="mb-3">
                        <label for="name" class="form-label fw-bold">Request Title</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    
                <div class="mb-3">
                    <label for="move_in_date" class="form-label fw-bold">Unit</label>
                    <select class="form-select" id="unit" name="unit" required>
                        <option value="" disabled selected>Select Unit</option>
                        {% for unit in units %}
                            <option value="{{unit.id}}">{{unit.name}}</option>
                        {% endfor %}
                    </select>
                </div>
                    
                    <div class="mb-2">
                        <label for="description" class="form-label fw-bold">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="2" required></textarea>
                    </div>
                </div>
                <div class="text-center mb-3">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Request</button>
                </div>
            </form>
        </div>
    </div>
</div>
