<div class="modal fade" id="deleteRequestModal{{request.id}}" tabindex="-1" aria-labelledby="tenantModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalLabel">Delete Request</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="tenantForm" method="POST" action="{% url 'delete-maintenance-request' %}">
                <div class="modal-body">
                    {% csrf_token %}
                    <input type="number" name="request_id" id="request_id" value="{{request.id}}" readonly hidden>
                    <div class="row mb-2">
                        <p>Are you sure you want to delete maintenance request title: <b>{{request.title}}</b>?</p>
                   </div>
                    
                <div class="text-center mb-2">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
