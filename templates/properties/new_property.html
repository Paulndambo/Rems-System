<!-- Add this modal HTML after the table in your template -->
<div class="modal fade" id="newPropertyModal" tabindex="-1" aria-labelledby="tenantModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalLabel">Add New Property</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="tenantForm" method="POST" action="{% url 'new-property' %}">
                <div class="modal-body">
                    {% csrf_token %}
                    <div class="row mb-3">
                    <div class="col">
                        <label for="name" class="form-label fw-bold">Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                  
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="unit" class="form-label fw-bold">Units</label>
                        <input type="number" class="form-control" id="units" name="units" required>
                    </div>  
                    <div class="col-md-6">
                        <label for="garbage_charge" class="form-label fw-bold">Garbage Charge</label>
                        <input type="number" class="form-control" id="garbage_charge" name="garbage_charge" required>
                    </div>
                </div>
                    
                        <div class="mb-3">
                            <label for="move_in_date" class="form-label fw-bold">Address/Location</label>
                            <input type="text" class="form-control" id="address" name="address" required>
                        </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="move_in_date" class="form-label fw-bold">City</label>
                            <input type="text" class="form-control" id="city" name="city" required>
                        </div>
                        <div class="col-md-6">
                            <label for="rent" class="form-label fw-bold">Country</label>
                            <input type="text" class="form-control" id="country" name="country" required>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col">
                            <label for="house_manager" class="form-label fw-bold">House/Property Manager</label>
                        <select class="form-select" id="house_manager" name="house_manager">
                            {% for house_manager in house_managers %}
                                <option value="{{house_manager.id}}">{{house_manager.first_name}} {{house_manager.last_name}} - (<b>{{house_manager.role}}</b>)</option>
                            {% endfor %}
                        </select>
                        </div>
                    </div>
                    
                </div>
                <div class="text-center mb-3">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Property</button>
                </div>
            </form>
        </div>
    </div>
</div>
