{% extends "base.html" %}
{% load static %}

{% block title %}New Property – REMS{% endblock %}
{% block page_title %}New Property{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
    <a href="{% url 'properties' %}" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
        <h1 class="fs-4 fw-bold mb-0">Add New Property</h1>
        <p class="text-muted mb-0" style="font-size:.82rem">Enter the details for your new building / property</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-12 col-xl-10">
        <form method="POST" action="{% url 'new-property' %}">
            {% csrf_token %}
            <div class="rems-card mb-4">
                <div class="rems-card__header">
                    <h5 class="rems-card__title"><i class="fa-solid fa-building me-2 text-primary"></i>Property Information</h5>
                </div>
                <div class="rems-card__body">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label fw-600">Property Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" id="name" class="form-control" placeholder="e.g. Sunset Apartments" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Number of Units <span class="text-danger">*</span></label>
                            <input type="number" name="units" id="units" class="form-control" placeholder="e.g. 24" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-600">Address line <span class="text-danger">*</span></label>
                            <input type="text" name="address" id="address" class="form-control" placeholder="123 Main Street" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">City <span class="text-danger">*</span></label>
                            <input type="text" name="city" id="city" class="form-control" placeholder="e.g. Nairobi" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Country <span class="text-danger">*</span></label>
                            <input type="text" name="country" id="country" class="form-control" placeholder="e.g. Kenya" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Garbage Charge (KES) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="garbage_charge" id="garbage_charge" class="form-control" value="130.00" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Water Charge (KES) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="water_charge" id="water_charge" class="form-control" value="250.00" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">House Manager<span class="text-danger">*</span></label>
                            <select name="house_manager" id="house_manager" class="form-select" required>
                                <option value="">Select a House Manager</option>
                                {% for manager in house_managers %}
                                    <option value="{{ manager.id }}">{{ manager.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'properties' %}" class="rems-btn rems-btn--ghost">Cancel</a>
                <button type="submit" class="rems-btn rems-btn--primary">
                    <i class="fa-solid fa-floppy-disk me-2"></i> Save Property
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
