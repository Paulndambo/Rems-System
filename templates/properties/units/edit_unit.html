{% extends "base.html" %}
{% load static %}

{% block title %}Edit Unit – REMS{% endblock %}
{% block page_title %}Edit Unit{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
    <a href="{% url 'units' %}" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
        <h1 class="fs-4 fw-bold mb-0">Edit Unit</h1>
        <p class="text-muted mb-0" style="font-size:.82rem">Update a unit by entering its ID and new details</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-12 col-xl-8">
        <form method="POST" action="{% url 'edit-unit' %}?unit_id={{ request.GET.unit_id }}">
            {% csrf_token %}
            <div class="rems-card mb-4">
                <div class="rems-card__header">
                    <h5 class="rems-card__title">Unit Updates</h5>
                </div>
                <div class="rems-card__body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-600">Unit ID <span class="text-danger">*</span></label>
                            <input type="text" name="unit_id" id="unit_id" value="{{ unit.id }}" class="form-control" disabled required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Unit Number/Name <span class="text-danger">*</span></label>
                            <input type="text" name="unit_number" class="form-control" value="{{ unit.name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Rent (KES) <span class="text-danger">*</span></label>
                            <input type="number" name="rent" step="0.01" min="0" class="form-control" value="{{ unit.rent|default:'0' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Floor</label>
                            <input type="text" name="floor" class="form-control" value="{{ unit.floor|default:'-' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Unit Type</label>
                            <select name="unit_type" class="form-select">
                                <option value="{{unit.unit_type}}">{{unit.unit_type}}</option>
                                {% for unit_type in unit_types %}
                                    {% if unit_type != unit.unit_type %}
                                <option value="{{ unit_type }}">{{ unit_type }}</option>
                                {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label fw-600">Status</label>
                            <select name="status" class="form-select">
                                <option value="{{unit.status}}">{{unit.status}}</option>
                                {% for status in statuses %}
                                {% if status != unit.status %}
                                <option value="{{ status }}">{{ status }}</option>
                                {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Security Deposit (KES)</label>
                            <input type="number" name="security_deposit" step="0.01" min="0" value="{{ unit.security_deposit|default:'0' }}" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Water Price / Unit (KES)</label>
                            <input type="number" name="water_price" step="0.01" min="0" value="{{ unit.water_price|default:'0' }}" class="form-control">
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'units' %}" class="rems-btn rems-btn--ghost">Cancel</a>
                <button type="submit" class="rems-btn rems-btn--primary">
                    <i class="fa-solid fa-pen-to-square me-2"></i> Update Unit
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
