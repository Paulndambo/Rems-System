<div class="modal fade" id="assignTenantModal{{ unit.id }}" tabindex="-1" aria-labelledby="assignTenantLabel{{ unit.id }}" aria-hidden="true">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="assignTenantLabel{{ unit.id }}">
                    <i class="fa-solid fa-user-plus"></i> Assign Tenant
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="assignTenantForm{{ unit.id }}" method="POST" action="{% url 'assign-tenant' %}">
                <div class="modal-body">
                    {% csrf_token %}
                    <input type="hidden" name="unit_id" value="{{ unit.id }}">
                    <div class="alert alert-info">
                        <i class="fa-solid fa-info-circle"></i> 
                        <strong>Please select a tenant to assign to this unit:</strong>
                    </div>
                    <div class="form-group">
                        <label for="tenant_id{{ unit.id }}" class="form-label">Tenant</label>
                        <select class="form-control" id="tenant_id" name="tenant_id" required>
                            <option value="">Select a tenant...</option>
                            {% for tenant in free_tenants %}
                                <option value="{{ tenant.id }}">{{ tenant.user.first_name }} {{ tenant.user.last_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fa-solid fa-times"></i> Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-user-plus"></i> Assign Tenant
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
