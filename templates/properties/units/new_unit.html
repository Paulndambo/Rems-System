{% extends "base.html" %}
{% load static %}

{% block title %}New Unit – REMS{% endblock %}
{% block page_title %}New Unit{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
    <a href="{% url 'units' %}" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
        <h1 class="fs-4 fw-bold mb-0">Create New Unit</h1>
        <p class="text-muted mb-0" style="font-size:.82rem">Add a rental unit to a {{ property.name }}</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-12 col-xl-8">
        <form method="POST" action="{% url 'new-unit' %}">
            {% csrf_token %}
            <div class="rems-card mb-4">
                <div class="rems-card__header">
                    <h5 class="rems-card__title">Unit Information</h5>
                </div>
                <div class="rems-card__body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-600">Property Name <span class="text-danger">*</span></label>
                            <input type="hidden" name="property_id" id="property_id" value="{{ request.GET.property_id }}">
                            <input type="text" class="form-control" value="{{ property.name }}" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Unit Number/Name <span class="text-danger">*</span></label>
                            <input type="text" name="unit_number" id="unit_number" class="form-control" placeholder="e.g. A-01" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Rent (KES) <span class="text-danger">*</span></label>
                            <input type="number" name="rent" id="rent" step="0.01" min="0" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Floor</label>
                            <input type="text" name="floor" id="floor" class="form-control" placeholder="e.g. Ground / 1">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Unit Type</label>
                            <select name="unit_type" id="unit_type" class="form-select">
                                <option value="Single Room">Single Room</option>
                                <option value="Bedsitter">Bedsitter</option>
                                <option value="Studio">Studio</option>
                                <option value="1 Bedroom">1 Bedroom</option>
                                <option value="2 Bedroom">2 Bedroom</option>
                                <option value="3 Bedroom">3 Bedroom</option>
                                <option value="4 Bedroom">4 Bedroom</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Status</label>
                            <select name="status" id="status" class="form-select">
                                <option value="Vacant">Vacant</option>
                                <option value="Occupied">Occupied</option>
                                <option value="Under Maintenance">Under Maintenance</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Security Deposit (KES)</label>
                            <input type="number" name="security_deposit" id="security_deposit" step="0.01" min="0" class="form-control" value="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Water Price / Unit (KES)</label>
                            <input type="number" name="water_price" id="water_price" step="0.01" min="0" class="form-control" value="0">
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'units' %}" class="rems-btn rems-btn--ghost">Cancel</a>
                <button type="submit" class="rems-btn rems-btn--primary">
                    <i class="fa-solid fa-floppy-disk me-2"></i> Save Unit
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
