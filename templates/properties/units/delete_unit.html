{% extends "base.html" %}
{% load static %}

{% block title %}Delete Unit – REMS{% endblock %}
{% block page_title %}Delete Unit{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-7 col-xl-5">
        <div class="rems-card mt-4">
            <div class="rems-card__header">
                <h5 class="rems-card__title text-danger">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i>Delete Unit
                </h5>
            </div>
            <div class="rems-card__body">
                <p class="text-muted">This action is permanent. Enter the unit ID to confirm deletion.</p>

                <form method="POST" action="{% url 'delete-unit' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-600">Unit ID <span class="text-danger">*</span></label>
                        <input type="number" name="unit_id" class="form-control" placeholder="e.g. 12" required>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'units' %}" class="rems-btn rems-btn--ghost">Cancel</a>
                        <button type="submit" class="rems-btn rems-btn--primary" onclick="return confirm('Delete this unit permanently?');">
                            <i class="fa-solid fa-trash-can me-2"></i>Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
