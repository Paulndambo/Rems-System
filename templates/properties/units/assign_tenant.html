<div class="modal fade" id="assignTenantModal{{ unit.id }}" tabindex="-1" aria-labelledby="assignTenantLabel{{ unit.id }}" aria-hidden="true">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="assignTenantLabel{{ unit.id }}">
                    <i class="fa-solid fa-user-plus"></i> Assign Tenant
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="assignTenantForm{{ unit.id }}" method="POST" action="{% url 'assign-tenant' %}">
                <div class="modal-body">
                    {% csrf_token %}
                    <input type="hidden" name="unit_id" value="{{ unit.id }}">
                    <div class="alert alert-warning">
                        <i class="fa-solid fa-exclamation-triangle"></i> 
                        <strong>Please confirm the following details:</strong>
                    </div>
                    
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="row mb-2">
                                <div class="col-6 fw-bold">Unit:</div>
                                <div class="col-6">{{ unit.property.name }} ({{ unit.name }})</div>
                            </div>
                        </div>
                    </div>

                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="row mb-2">
                                
                            <select name="tenant_id" class="form-select" required>
                                <option value="" disabled selected>Select Tenant</option>
                                {% for tenant in tenants %}
                                    <option value="{{ tenant.id }}">{{ tenant.user.first_name }} {{ tenant.user.last_name }}</option>
                                {% endfor %}
                            </div>
                        </div>
                    </div>

                    <p class="text-muted mb-0">
                        <small>Once confirmed, the tenant will be assigned to this unit.</small>
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fa-solid fa-times"></i> Cancel
                    </button>
                    <button type="submit" class="btn btn-success">
                        <i class="fa-solid fa-check"></i> Yes, Confirm Removal
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
