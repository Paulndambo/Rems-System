{% extends "base.html" %}
{% load static %}

{% block title %}Record Expense – REMS{% endblock %}
{% block page_title %}New Expense{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
    <a href="{% url 'expenses' %}" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
        <h1 class="fs-4 fw-bold mb-0">Record Expense</h1>
        <p class="text-muted mb-0" style="font-size:.82rem">Log a property or operational cost</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-12 col-xl-8">
        <form method="POST" action="{% url 'new-expense' %}">
            {% csrf_token %}
            <div class="rems-card mb-4">
                <div class="rems-card__header">
                    <h5 class="rems-card__title"><i class="fa-solid fa-receipt me-2 text-primary"></i>Expense Details</h5>
                </div>
                <div class="rems-card__body">
                    <div class="row g-4">
                        <div class="col-md-8">
                            <label class="form-label fw-600">Title / Short Description <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control" placeholder="e.g. Broken Pipe Repair" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-600">Amount (KES) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="amount" class="form-control" placeholder="Amount" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Expense Category <span class="text-danger">*</span></label>
                            <select name="expense_type" class="form-select" required>
                                <option value="">-- Choose Category --</option>
                                {% for type in expense_types %}
                                <option value="{{ type }}">{{ type }}</option>
                                {% empty %}
                                <option value="Maintenance">Maintenance</option>
                                <option value="Cleaning">Cleaning</option>
                                <option value="Salaries">Salaries</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Other">Other</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Date Paid / Occurred <span class="text-danger">*</span></label>
                            <input type="date" name="spend_on" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Related Property (Optional)</label>
                            <select name="property" class="form-select">
                                <option value="">None / General Expense</option>
                                {% for p in properties %}
                                <option value="{{ p.id }}">{{ p.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Related Unit (Optional)</label>
                            <select name="unit" class="form-select">
                                <option value="">None / Property Wide</option>
                                {% for u in units %}
                                <option value="{{ u.id }}">{{ u.property.name }} - {{ u.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-600">Detailed Description</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Additional notes about this expense..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'expenses' %}" class="rems-btn rems-btn--ghost">Cancel</a>
                <button type="submit" class="rems-btn rems-btn--primary">
                    <i class="fa-solid fa-floppy-disk me-2"></i> Save Expense
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
