{% extends "base.html" %}
{% load static %}

{% block title %}Change Password – REMS{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="d-flex justify-content-center mt-4">
    <div class="rems-card" style="max-width:460px;width:100%;">
        <div class="rems-card__header">
            <h5 class="rems-card__title"><i class="fa-solid fa-key me-2 text-primary"></i>Change Password</h5>
        </div>
        <div class="rems-card__body">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-600">New Password <span class="text-danger">*</span></label>
                    <input type="password" name="password" class="form-control" required id="newPassword" placeholder="Enter new password">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-600">Confirm Password <span class="text-danger">*</span></label>
                    <input type="password" name="confirm_password" class="form-control" required id="confirmPassword" placeholder="Re-enter password">
                    <div id="passwordMismatch" class="text-danger mt-1" style="font-size:.8rem;display:none;">
                        <i class="fa-solid fa-circle-xmark me-1"></i> Passwords do not match
                    </div>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="rems-btn rems-btn--primary" id="changePasswordBtn">
                        <i class="fa-solid fa-lock me-2"></i> Update Password
                    </button>
                    <a href="{% url 'users' %}" class="rems-btn rems-btn--ghost text-center">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('confirmPassword').addEventListener('input', function(){
    const pw = document.getElementById('newPassword').value;
    const msg = document.getElementById('passwordMismatch');
    msg.style.display = (this.value && this.value !== pw) ? 'block' : 'none';
});
</script>
{% endblock %}
