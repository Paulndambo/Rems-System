{% extends "base.html" %}
{% load static %}

{% block title %}Edit User – REMS{% endblock %}
{% block page_title %}Edit User{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
    <a href="{% url 'users' %}" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
        <h1 class="fs-4 fw-bold mb-0">Edit User</h1>
        <p class="text-muted mb-0" style="font-size:.82rem">Update user account details</p>
    </div>
</div>

<form method="POST" action="{% url 'edit-user' %}">
    {% csrf_token %}
    <input type="hidden" name="user_id" value="{{ request.GET.id }}">
    <div class="row g-4">
        <div class="col-12 col-lg-8">
            <div class="rems-card">
                <div class="rems-card__header">
                    <h5 class="rems-card__title"><i class="fa-solid fa-user-gear me-2 text-primary"></i>User Information</h5>
                </div>
                <div class="rems-card__body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-600">First Name <span class="text-danger">*</span></label>
                            <input type="text" name="first_name" class="form-control" required id="editUserFirstName" value="{{ current_user.first_name }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Last Name <span class="text-danger">*</span></label>
                            <input type="text" name="last_name" class="form-control" required id="editUserLastName" value="{{ current_user.last_name }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Username <span class="text-danger">*</span></label>
                            <input type="text" name="username" class="form-control" required id="editUserUsername" value="{{ current_user.username }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Email</label>
                            <input type="email" name="email" class="form-control" id="editUserEmail" value="{{ current_user.email }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Phone</label>
                            <input type="tel" name="phone" class="form-control" id="editUserPhone" value="{{ current_user.phone }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">ID Number</label>
                            <input type="text" name="id_number" class="form-control" id="editUserIdNumber" value="{{ current_user.id_number }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Gender</label>
                            <select name="gender" class="form-select" id="editUserGender">
                                <option value="">-- Select --</option>
                                {% for g in genders %}
                                    <option value="{{ g }}" {% if current_user.gender == g %}selected{% endif %}>{{ g }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Marital Status</label>
                            <select name="marital_status" class="form-select" id="editUserMaritalStatus">
                                <option value="">-- Select --</option>
                                {% for ms in marital_statuses %}
                                    <option value="{{ ms }}" {% if current_user.marital_status == ms %}selected{% endif %}>
                                        {{ ms }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Role <span class="text-danger">*</span></label>
                            <select name="role" class="form-select" required id="editUserRole">
                                <option value="">-- Select Role --</option>
                                {% for r in roles %}
                                    <option value="{{ r }}" {% if current_user.role == r %}selected{% endif %}>
                                        {{ r }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-4">
            <div class="rems-card">
                <div class="rems-card__header"><h5 class="rems-card__title">Save Changes</h5></div>
                <div class="rems-card__body">
                    <div class="d-grid gap-2">
                        <button type="submit" class="rems-btn rems-btn--primary" id="saveUserBtn">
                            <i class="fa-solid fa-floppy-disk me-2"></i> Save Changes
                        </button>
                        <a href="{% url 'users' %}" class="rems-btn rems-btn--ghost text-center">Cancel</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
{% endblock %}
