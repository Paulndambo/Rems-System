<!-- Add this modal HTML after the table in your template -->
<div class="modal fade" id="newBirthdayMessageModal" tabindex="-1" aria-labelledby="tenantModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-md">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalLabel">New Birthday Message</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="tenantForm" method="POST" action="{% url 'new-message' %}" enctype="multipart/form-data">
                <div class="modal-body">
                    {% csrf_token %}
                    
                    <input type="text" hidden required readonly name="purpose" id="purpose" value="Birthday">
                    
                    <div class="row mb-3">
                        <div class="col">
                            <label for="rent" class="form-label fw-bold">Client Name</label>
                            <select class="form-select" id="receiver" name="receiver">
                                <option value="" selected></option>
                                {% for client in clients %}
                                <option value="{{client.id}}">{{client.name}}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
          
                </div>
                <div class="text-center mb-3">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Message</button>
                </div>
            </form>
        </div>
    </div>
</div>
