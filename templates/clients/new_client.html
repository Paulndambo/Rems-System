<!-- Add this modal HTML after the table in your template -->
<div class="modal fade" id="newClientModal" tabindex="-1" aria-labelledby="tenantModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalLabel">Add New Client</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="tenantForm" method="POST" action="{% url 'new-tour-client' %}" enctype="multipart/form-data">
                <div class="modal-body">
                    {% csrf_token %}
                    <div class="row mb-3">
                        <div class="col">
                            <label for="first_name" class="form-label fw-bold">Client Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="col">
                            <label for="contact" class="form-label fw-bold">Phone Number</label>
                            <input type="tel" class="form-control" id="phone_number" name="phone_number" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label for="email" class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email">
                        </div>
                        <div class="col">
                            <label for="id_number" class="form-label fw-bold">ID Number</label>
                            <input type="text" class="form-control" id="id_number" name="id_number">
                        </div>
                       
                    </div>

                    <div class="row mb-3">
            
                        <div class="col">
                            <label for="id_number" class="form-label fw-bold">Passport Number</label>
                            <input type="text" class="form-control" id="passport_number" name="passport_number">
                        </div>

                        <div class="col">
                            <label for="id_number" class="form-label fw-bold">Nationality</label>
                            <input type="text" class="form-control" id="nationality" name="nationality">
                        </div>
                    </div>

                    <div class="row mb-3">
                        
                        <div class="col">
                            <label for="move_in_date" class="form-label fw-bold">Date of Birth</label>
                            <input type="date" class="form-control" id="dob" name="dob">
                        </div>
                        <div class="col">
                            <label for="rent" class="form-label fw-bold">Gender</label>
                            <select class="form-select" id="gender" name="gender">
                                <option value="" selected>Choose...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                    </div>

          
                </div>
                <div class="text-center mb-3">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Client</button>
                </div>
            </form>
        </div>
    </div>
</div>
