{% extends "clients/base.html" %}

{% block content %}
<!-- Stats Cards Row -->
<div class="row g-4 mb-4">
    <div class="col-md-6 col-xl-6">
        <a href="{% url 'holiday-messages' %}" class="text-decoration-none">
            <div class="card card-stats h-100 shadow-sm hover-lift">
                <div class="card-body bg-primary bg-gradient text-white rounded">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title mb-0 text-white-50">Total Messages</h6>
                            <h2 class="my-2 fw-bold">{{messages_count}}</h2>
                            <p class="card-text mb-0 d-flex align-items-center">
                                <i class="fas fa-arrow-up me-1 small"></i>
                                
                            </p>
                        </div>
                        <div class="stat-icon-container">
                            <i class="fas fa-building stat-icon opacity-75"></i>
                        </div>
                    </div>
                </div>
            </div>
        </a>
    </div>
    <div class="col-md-6 col-xl-6">
        <a href="{% url 'tour-clients' %}" class="text-decoration-none">
            <div class="card card-stats h-100 shadow-sm hover-lift">
                <div class="card-body bg-success bg-gradient text-white rounded">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="card-title mb-0 text-white-50">Clients</h6>
                            <h2 class="my-2 fw-bold">{{clients_count}}</h2>
                            <p class="card-text mb-0 d-flex align-items-center">
                                <i class="fas fa-arrow-up me-1 small"></i>
                               
                            </p>
                        </div>
                        <div class="stat-icon-container">
                            <i class="fas fa-users stat-icon opacity-75"></i>
                        </div>
                    </div>
                </div>
            </div>
        </a>
    </div>
  
 
</div>

<!-- Charts Section -->


<!-- Add custom CSS -->
<style>
    .hover-lift {
        transition: transform 0.2s ease;
    }
    .hover-lift:hover {
        transform: translateY(-5px);
    }
    .stat-icon-container {
        background: rgba(255, 255, 255, 0.1);
        padding: 1rem;
        border-radius: 50%;
    }
    .stat-icon {
        font-size: 2rem;
    }
    .activity-icon {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .card {
        border: none;
        border-radius: 0.75rem;
    }
    .card-header {
        border-bottom: 1px solid rgba(0,0,0,.05);
    }
</style>

<!-- Add Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Global charts references
    let revenueChart;
    let occupancyChart;
    
    // Initialize charts
    function initCharts(yearData) {
        // Revenue Chart
        const revenueCtx = document.getElementById('revenueChart').getContext('2d');
        
        // Destroy existing chart if it exists
        if (revenueChart) {
            revenueChart.destroy();
        }
        
        revenueChart = new Chart(revenueCtx, {
            type: 'line',
            data: {
                labels: yearData.revenue.labels,
                datasets: [{
                    label: 'Expected Revenue',
                    data: yearData.revenue.expected_amounts,
                    borderColor: 'rgb(255, 99, 132)',
                    borderDash: [5, 5],
                    tension: 0.1,
                    fill: false
                },
                {
                    label: 'Actual Revenue',
                    data: yearData.revenue.paid_amounts,
                    borderColor: 'rgb(75, 192, 192)',
                    tension: 0.1,
                    fill: true,
                    backgroundColor: 'rgba(75, 192, 192, 0.1)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: true,
                        position: 'top'
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': Kes.' + context.parsed.y.toLocaleString();
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value, index, values) {
                                return 'Kes.' + value.toLocaleString();
                            }
                        }
                    }
                }
            }
        });

        // Occupancy Chart
        const occupancyCtx = document.getElementById('occupancyChart').getContext('2d');
        
        // Destroy existing chart if it exists
        if (occupancyChart) {
            occupancyChart.destroy();
        }
        
        occupancyChart = new Chart(occupancyCtx, {
            type: 'doughnut',
            data: {
                labels: ['Occupied', 'Vacant'],
                datasets: [{
                    data: [
                        yearData.occupancy.occupied,
                        yearData.occupancy.vacant
                    ],
                    backgroundColor: [
                        'rgb(75, 192, 192)',
                        'rgb(255, 99, 132)'
                    ]
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom'
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const total = yearData.occupancy.occupied + yearData.occupancy.vacant;
                                const percentage = ((context.parsed / total) * 100).toFixed(1);
                                return `${context.label}: ${context.parsed} (${percentage}%)`;
                            }
                        }
                    }
                }
            }
        });
    }

    // Initial chart data
    const initialData = {
        revenue: {
            labels: JSON.parse('{{ chart_data.labels|safe }}'),
            expected_amounts: JSON.parse('{{ chart_data.expected_amounts|safe }}'),
            paid_amounts: JSON.parse('{{ chart_data.paid_amounts|safe }}')
        },
        occupancy: {
            occupied: {{ occupancy_data.occupied|default:0 }},
            vacant: {{ occupancy_data.vacant|default:0 }}
        },
    };

    // Initialize charts with initial data
    document.addEventListener('DOMContentLoaded', function() {
        initCharts(initialData);
        
        // Year filter change event
        document.getElementById('yearFilter').addEventListener('change', function() {
            const selectedYear = this.value;
            
            // Fetch data for the selected year
            fetch(`/api/chart-data/?year=${selectedYear}`)
                .then(response => response.json())
                .then(data => {
                    // Update charts
                    initCharts(data);
                    
                    // Update total revenue display
                    if (data.total_revenue !== undefined) {
                        document.querySelector('.bg-warning h2.fw-bold').textContent = data.total_revenue;
                    }
                })
                .catch(error => {
                    console.error('Error fetching chart data:', error);
                });
        });
    });
</script>
{% endblock content %}
