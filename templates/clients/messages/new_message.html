<!-- Add this modal HTML after the table in your template -->
<div class="modal fade" id="newHolidayMessageModal" tabindex="-1" aria-labelledby="tenantModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalLabel">New Holiday Message</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="tenantForm" method="POST" action="{% url 'new-message' %}" enctype="multipart/form-data">
                <div class="modal-body">
                    {% csrf_token %}
                    
                    <input type="text" hidden required readonly name="purpose" id="purpose" value="Holiday">
                    <div class="row mb-3">
                        <div class="col">
                            <label for="id_number" class="form-label fw-bold">Holiday Name</label>
                            <input type="text" class="form-control" id="holiday_name" name="holiday_name">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label for="move_in_date" class="form-label fw-bold">Holiday Date</label>
                            <input type="date" class="form-control" id="holiday_date" name="holiday_date">
                        </div>
                        <div class="col">
                            <label for="rent" class="form-label fw-bold">Country</label>
                            <select class="form-select" id="country" name="country">
                                <option value="Worldwide" selected>Worldwide</option>
                                <option value="Kenya">Kenya</option>
                                <option value="Uganda">Uganda</option>
                                <option value="Tanzania">Tanzania</option>
                                <option value="Australia">Australia</option>
                                <option value="Britain">Britain</option>
                                <option value="United States">United States</option>
                                <option value="Sweden">Sweden</option>
                                <option value="Latvia">Latvia</option>
                            </select>
                        </div>
                    </div>

          
                </div>
                <div class="text-center mb-3">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Message</button>
                </div>
            </form>
        </div>
    </div>
</div>
