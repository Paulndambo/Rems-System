<!-- Add this modal HTML after the table in your template -->
<div class="modal fade" id="editEmployeeModal{{user.id}}" tabindex="-1" aria-labelledby="tenantModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalLabel">Edit Employee</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="tenantForm" method="POST" action="{% url 'edit-employee' %}">
                <div class="modal-body">
                    {% csrf_token %}
                    <input type="number" name="user_id" id="user_id" value="{{user.id}}" readonly hidden>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="first_name" class="form-label fw-bold">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" value="{{user.first_name}}" required>
                        </div>
                        <div class="col">
                            <label for="last_name" class="form-label fw-bold">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" value="{{user.last_name}}" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="contact" class="form-label fw-bold">Contact Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" value="{{user.phone}}" required>
                        </div>
                        <div class="col">
                            <label for="email" class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{user.email}}">
                        </div>
                        
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="id_number" class="form-label fw-bold">Username</label>
                            <input type="text" class="form-control" id="username" name="username" value="{{user.username}}" required>
                        </div>
                        <div class="col">
                            <label for="id_number" class="form-label fw-bold">ID Number</label>
                            <input type="text" class="form-control" id="id_number" name="id_number" value="{{user.id_number}}" required>
                        </div>
                       
                        <div class="col">
                            <label for="rent" class="form-label fw-bold">Gender</label>
                            <select class="form-select" id="gender" name="gender">
                                <option value="{{user.gender}}" selected>{{user.gender}}</option>
                                {% for gender in genders %}
                                    {% if gender != user.gender %}
                                        <option value="{{gender}}">{{gender}}</option>
                                    {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label for="move_in_date" class="form-label fw-bold">Role</label>
                            <select class="form-select" id="role" name="role">
                                <option value="{{user.role}}" selected>{{user.role}}</option>
                                {% for role in roles %}
                                    {% if role != user.role %}
                                        <option value="{{role}}">{{role}}</option>
                                    {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                       
                        <div class="col">
                            <label for="rent" class="form-label fw-bold">Marital Status</label>
                            <select class="form-select" id="marital_status" name="marital_status">
                                <option value="{{user.marital_status}}" selected>{{user.marital_status}}</option>
                                {% for status in marital_statuses %}
                                    {% if status != user.marital_status %}
                                        <option value="{{status}}">{{status}}</option>
                                    {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                   
                </div>
                <div class="text-center mb-3">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save User</button>
                </div>
            </form>
        </div>
    </div>
</div>
