<!-- Add this modal HTML after the table in your template -->
<div class="modal fade" id="editClientModal{{client.id}}" tabindex="-1" aria-labelledby="tenantModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalLabel">Edit Client</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="tenantForm" method="POST" action="{% url 'edit-tour-client' %}" enctype="multipart/form-data">
                <div class="modal-body">
                    {% csrf_token %}
                    <input type="hidden" name="client_id" id="client_id" value="{{client.id}}" />
                    <div class="row mb-3">
                        <div class="col">
                            <label for="first_name" class="form-label fw-bold">Client Name</label>
                            <input type="text" class="form-control" id="name" name="name" value={{client.full_name}} required>
                        </div>
                        <div class="col">
                            <label for="contact" class="form-label fw-bold">Phone Number</label>
                            <input type="tel" class="form-control" id="phone_number" name="phone_number" value={{client.phone_number}} required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label for="email" class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{client.email}}">
                        </div>
                        <div class="col">
                            <label for="id_number" class="form-label fw-bold">ID Number</label>
                            <input type="text" class="form-control" id="id_number" name="id_number" value="{{client.id_number}}">
                        </div>
                       
                    </div>

                    <div class="row mb-3">
            
                        <div class="col">
                            <label for="id_number" class="form-label fw-bold">Passport Number</label>
                            <input type="text" class="form-control" id="passport_number" name="passport_number" value="{{ client.passport_number }}">
                        </div>

                        <div class="col">
                            <label for="id_number" class="form-label fw-bold">Nationality</label>
                            <input type="text" class="form-control" id="nationality" name="nationality" value="{{ client.nationality }}"> 
                        </div>
                    </div>

                    <div class="row mb-3">
                        
                        <div class="col">
                            <label for="move_in_date" class="form-label fw-bold">Date of Birth</label>
                            <input type="date" class="form-control" id="dob" name="dob" value="{{client.dob|date:'Y-m-d'}}">
                        </div>
                        <div class="col">
                            <label for="rent" class="form-label fw-bold">Gender</label>
                            <select class="form-select" id="gender" name="gender">
                                <option value="{{client.gender}}" selected>{{client.gender}}</option>
                                {% for gender in genders %}
                                    {% if gender != client.gender %}
                                        <option value="{{gender}}">{{gender}}</option>
                                    {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                    </div>

          
                </div>
                <div class="text-center mb-3">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Edit Client</button>
                </div>
            </form>
        </div>
    </div>
</div>
