<!-- Add this modal HTML after the table in your template -->
<div class="modal fade" id="newTenantModal" tabindex="-1" aria-labelledby="tenantModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalLabel">Add New Tenant</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="tenantForm" method="POST" action="{% url 'new-tenant' %}">
                <div class="modal-body">
                    {% csrf_token %}
                    <div class="row mb-3">
                        <div class="col">
                            <label for="first_name" class="form-label fw-bold">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" required>
                        </div>
                        <div class="col">
                            <label for="last_name" class="form-label fw-bold">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="contact" class="form-label fw-bold">Contact Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" required>
                        </div>
                        <div class="col">
                            <label for="email" class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email">
                        </div>
                        <div class="col">
                            <label for="id_number" class="form-label fw-bold">ID Number</label>
                            <input type="text" class="form-control" id="id_number" name="id_number" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="move_in_date" class="form-label fw-bold">Lease Date</label>
                            <input type="date" class="form-control" id="lease_date" name="lease_date">
                        </div>
                        <div class="col">
                            <label for="move_in_date" class="form-label fw-bold">Move-in Date</label>
                            <input type="date" class="form-control" id="move_in_date" name="move_in_date">
                        </div>
                        <div class="col">
                            <label for="rent" class="form-label fw-bold">Gender</label>
                            <select class="form-select" id="gender" name="gender">
                                <option value="" selected>Choose...</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label for="move_in_date" class="form-label fw-bold">Lease Duration</label>
                            <select class="form-select" id="lease_duration" name="lease_duration">
                                <option value="" selected>Choose...</option>
                                {% for duration in lease_durations %}
                                    <option value="{{duration}}">{{duration}}</option>
                                {% endfor %}
                            </select>
                        </div>
                       
                        <div class="col">
                            <label for="rent" class="form-label fw-bold">Marital Status</label>
                            <select class="form-select" id="marital_status" name="marital_status">
                                <option value="" selected>Choose...</option>
                                {% for status in marital_statuses %}
                                    <option value="{{status}}">{{status}}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                   
                </div>
                <div class="text-center mb-3">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Tenant</button>
                </div>
            </form>
        </div>
    </div>
</div>
