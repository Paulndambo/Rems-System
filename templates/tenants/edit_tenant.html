{% extends "base.html" %}
{% load static %}

{% block title %}Edit Tenant – REMS{% endblock %}
{% block page_title %}Edit Tenant{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
    <a href="{% url 'tenants' %}" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div>
        <h1 class="fs-4 fw-bold mb-0">Edit Tenant</h1>
        <p class="text-muted mb-0" style="font-size:.82rem">Update tenant information below</p>
    </div>
</div>

<form method="POST" action="{% url 'edit-tenant' %}">
    {% csrf_token %}
    <input type="hidden" name="tenant_id" value="{{ tenant.pk }}">

    <div class="row g-4">
        <div class="col-12 col-lg-8">

            <!-- Personal Info -->
            <div class="rems-card mb-4">
                <div class="rems-card__header">
                    <h5 class="rems-card__title"><i class="fa-solid fa-user me-2 text-primary"></i>Personal Information</h5>
                </div>
                <div class="rems-card__body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-600">First Name <span class="text-danger">*</span></label>
                            <input type="text" name="first_name" class="form-control"
                                   value="{{ tenant.user.first_name }}" required id="editFirstName">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Last Name <span class="text-danger">*</span></label>
                            <input type="text" name="last_name" class="form-control"
                                   value="{{ tenant.user.last_name }}" required id="editLastName">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Email</label>
                            <input type="email" name="email" class="form-control"
                                   value="{{ tenant.user.email }}" id="editEmail">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Phone <span class="text-danger">*</span></label>
                            <input type="tel" name="phone" class="form-control"
                                   value="{{ tenant.user.phone }}" required id="editPhone">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">ID Number</label>
                            <input type="text" name="id_number" class="form-control"
                                   value="{{ tenant.user.id_number }}" id="editIdNumber">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Gender</label>
                            <select name="gender" class="form-select" id="editGender">
                                <option value="">-- Select --</option>
                                {% for g in "Male,Female,Other"|split:"," %}
                                <option value="{{ g }}" {% if tenant.user.gender == g %}selected{% endif %}>{{ g }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Marital Status</label>
                            <select name="marital_status" class="form-select" id="editMaritalStatus">
                                <option value="">-- Select --</option>
                                {% for ms in "Single,Married,Divorced,Widowed"|split:"," %}
                                <option value="{{ ms }}" {% if tenant.user.marital_status == ms %}selected{% endif %}>{{ ms }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lease Info -->
            <div class="rems-card">
                <div class="rems-card__header">
                    <h5 class="rems-card__title"><i class="fa-regular fa-file-lines me-2 text-primary"></i>Lease Details</h5>
                </div>
                <div class="rems-card__body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-600">Move-in Date</label>
                            <input type="date" name="move_in_date" class="form-control"
                                   value="{{ tenant.move_in_date|date:'Y-m-d' }}" id="editMoveInDate">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Lease Date</label>
                            <input type="date" name="lease_date" class="form-control"
                                   value="{{ tenant.lease_date|date:'Y-m-d' }}" id="editLeaseDate">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Lease Duration</label>
                            <select name="lease_duration" class="form-select" id="editLeaseDuration">
                                <option value="">-- Select --</option>
                                {% for dur in "3 Months,6 Months,9 Months,1 Year,2 Years,3 Years,4 Years"|split:"," %}
                                <option value="{{ dur }}" {% if tenant.lease_duration == dur %}selected{% endif %}>{{ dur }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-600">Rental Unit</label>
                            <select name="rental_unit" class="form-select" id="editRentalUnit">
                                <option value="">-- Keep Current --</option>
                                {% for unit in units %}
                                <option value="{{ unit.id }}">{{ unit.name }} – {{ unit.property.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="col-12 col-lg-4">
            <div class="rems-card">
                <div class="rems-card__header">
                    <h5 class="rems-card__title">Save Changes</h5>
                </div>
                <div class="rems-card__body">
                    <div class="d-grid gap-2">
                        <button type="submit" class="rems-btn rems-btn--primary" id="saveEditTenant">
                            <i class="fa-solid fa-floppy-disk me-2"></i> Save Changes
                        </button>
                        <a href="{% url 'tenants' %}" class="rems-btn rems-btn--ghost text-center">Cancel</a>
                    </div>
                </div>
            </div>
        </div>

    </div>
</form>
{% endblock %}
