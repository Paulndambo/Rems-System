<!-- Add this modal HTML after the table in your template -->
<div class="modal fade" id="editTenantModal{{tenant.id}}" tabindex="-1" aria-labelledby="tenantModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tenantModalLabel">Edit Tenant</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="tenantForm" method="POST" action="{% url 'edit-tenant' %}">
                <div class="modal-body">
                    {% csrf_token %}
                    <input type="number" name="tenant_id" id="tenant_id" value="{{tenant.id}}" readonly hidden>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="first_name" class="form-label fw-bold">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" value="{{tenant.user.first_name}}" required>
                        </div>
                        <div class="col">
                            <label for="last_name" class="form-label fw-bold">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" value="{{tenant.user.last_name}}" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="contact" class="form-label fw-bold">Contact Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" value="{{tenant.user.phone}}" required>
                        </div>
                        <div class="col">
                            <label for="email" class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{tenant.user.email}}">
                        </div>
                        <div class="col">
                            <label for="id_number" class="form-label fw-bold">ID Number</label>
                            <input type="text" class="form-control" id="id_number" name="id_number" value="{{tenant.user.id_number}}">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="move_in_date" class="form-label fw-bold">Lease Date</label>
                            <input type="date" class="form-control" id="lease_date" name="lease_date" value="{{tenant.lease_date| date:'Y-m-d'}}">
                        </div>
                        <div class="col">
                            <label for="move_in_date" class="form-label fw-bold">Move-in Date</label>
                            <input type="date" class="form-control" id="move_in_date" name="move_in_date" value="{{tenant.move_in_date| date:'Y-m-d'}}">
                        </div>
                        <div class="col">
                            <label for="rent" class="form-label fw-bold">Gender</label>
                            <select class="form-select" id="gender" name="gender">
                                <option value="{{tenant.user.gender}}" selected>{{tenant.user.gender}}</option>
                                {% if tenant.user.gender == 'Male' %}
                                    <option value="Female">Female</option>
                                {% else %}
                                    <option value="Male">Male</option>
                                {% endif %}
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label for="move_in_date" class="form-label fw-bold">Lease Duration</label>
                            <select class="form-select" id="lease_duration" name="lease_duration">
                                <option value="{{tenant.lease_duration}}" selected>{{tenant.lease_duration}}</option>
                                {% for duration in lease_durations %}
                                    {% if duration != tenant.lease_duration %}
                                        <option value="{{duration}}">{{duration}}</option>
                                    {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                       
                        <div class="col">
                            <label for="rent" class="form-label fw-bold">Marital Status</label>
                            <select class="form-select" id="marital_status" name="marital_status">
                                <option value="{{tenant.user.marital_status}}" selected>{{tenant.user.marital_status}}</option>
                                {% for status in marital_statuses %}
                                    {% if status != tenant.user.marital_status %}
                                        <option value="{{status}}">{{status}}</option>
                                    {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="rental_unit" class="form-label fw-bold">Rental Unit</label>
                            <select class="form-select" id="rental_unit" name="rental_unit">
                                <option value="{{tenant.unit.id}}" selected>{{tenant.unit.property.name}} - (<b>{{tenant.unit.name}}</b>)</option>
                                {% for unit in units %}
                                    {% if unit.id != tenant.unit.id %}
                                        <option value="{{unit.id}}">{{unit.property.name}} - (<b>{{unit.name}}</b>)</option>
                                    {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                   
                </div>
                <div class="text-center mb-3">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Tenant</button>
                </div>
            </form>
        </div>
    </div>
</div>
