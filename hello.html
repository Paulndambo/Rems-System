<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Country and City Selector</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }
    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }
    select, input {
      padding: 8px;
      width: 250px;
    }
  </style>
</head>
<body>

  <h2>Country and City Form</h2>

  <form>
    <label for="country">Select Country:</label>
    <select id="country">
      <option value="">-- Select Country --</option>
      <option value="kenya">Kenya</option>
      <option value="usa">USA</option>
      <option value="india">India</option>
    </select>

    <label for="city">Search City:</label>
    <input list="city-options" id="city" placeholder="Start typing a city..." />
    <datalist id="city-options"></datalist>
  </form>

  <script>
    const cityData = {
      kenya: ['Nairobi', 'Mombasa', 'Kisumu'],
      usa: ['New York', 'Los Angeles', 'Chicago'],
      india: ['Mumbai', 'Delhi', 'Bangalore']
    };

    const countrySelect = document.getElementById('country');
    const cityInput = document.getElementById('city');
    const cityDatalist = document.getElementById('city-options');

    countrySelect.addEventListener('change', function () {
      const selectedCountry = this.value;
      const cities = cityData[selectedCountry] || [];

      // Clear existing options
      cityDatalist.innerHTML = '';

      // Populate new options
      cities.forEach(city => {
        const option = document.createElement('option');
        option.value = city;
        cityDatalist.appendChild(option);
      });

      // Clear city input on country change
      cityInput.value = '';
    });
  </script>

</body>
</html>
